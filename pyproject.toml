[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "yingzhang"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2,<3", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "keyring>=25.6,<26", "cryptography>=42,<44", "pymupdf>=1.25,<2", "python-docx>=1.1,<2", "python-pptx>=1.0,<2", "openpyxl>=3.1,<4", "beautifulsoup4>=4.13,<5", "python-multipart>=0.0.20,<1", "pillow>=10,<11"]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]
[tool.setuptools]
package-dir = {"" = "apps/api"}
[tool.setuptools.packages.find]
where = ["apps/api"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
ignore = ["B008"]
